name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print code
        run: |
          J=TMessagesProj/src/main/java/org/telegram
          show() { awk -v a="$2" -v b="$3" 'NR>=a && NR<=b {printf "%d: %s\n", NR, $0}' "$1" | fold -s -w 52; }
          {
            echo "## A. Swap set methods"
            echo '```'
            F=$J/ui/Components/AnimatedEmojiDrawable.java
            for N in $(grep -n 'public boolean set(long' $F | cut -d: -f1); do show $F $N $((N+28)); echo ----; done
            echo '```'
            echo "## B. localeValues lines"
            echo '```'
            grep -n 'localeValues' $J/messenger/LocaleController.java | cut -c1-200 | fold -s -w 52 | head -90
            echo '```'
            echo "## C. formatString"
            echo '```'
            F=$J/messenger/LocaleController.java
            N=$(grep -n 'static String formatString(' $F | head -1 | cut -d: -f1)
            show $F $N $((N+28))
            echo '```'
            echo "## D. version in settings"
            echo '```'
            grep -n 'v%s\|BUILD_VERSION_STRING\|getVersionName' $J/ui/SettingsActivity.java | cut -c1-220 | fold -s -w 52 | head -30
            echo '```'
            echo "## E. title in DialogsActivity"
            echo '```'
            show $J/ui/DialogsActivity.java 3438 3452
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
