name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print code
        run: |
          U=TMessagesProj/src/main/java/org/telegram/ui
          f() { cut -c1-170 | fold -s -w 52; }
          {
            echo "## A. stories bar in DialogsActivity"
            echo '```'
            grep -n 'dialogStoriesCell' $U/DialogsActivity.java | f | head -30
            echo '```'
            echo "## B. bottom bar files"
            echo '```'
            grep -rln 'class [A-Za-z]*\(BottomTabs\|BottomBar\|NavBar\|TabBar\|FloatingBottom\)' --include=*.java TMessagesProj/src/main/java | head -10
            grep -rn 'bottomTabs\|BottomTabs' --include=*.java $U/LaunchActivity.java | f | head -14
            echo '```'
            echo "## C. theme colors for the bar"
            echo '```'
            grep -rn 'key_chats_menuBackground\|key_actionBarDefault\b' --include=Theme.java TMessagesProj/src/main/java | f | head -6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
