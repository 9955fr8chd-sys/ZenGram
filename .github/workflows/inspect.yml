name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print build files
        run: |
          f() { fold -s -w 52; }
          {
            echo "## A. Gradle files"
            echo '```'
            ls TMessagesProj_App | f
            ls TMessagesProj/config 2>/dev/null | f
            echo '```'
            echo "## B. applicationId and signing"
            echo '```'
            grep -rn "applicationId\|namespace\|signingConfig\|storeFile\|storePassword\|keyAlias\|minifyEnabled\|productFlavors\|buildTypes\|flavorDimensions" TMessagesProj_App/build.gradle* TMessagesProj/build.gradle* build.gradle* gradle.properties 2>/dev/null | cut -c1-200 | f | head -70
            echo '```'
            echo "## C. flavors and types"
            echo '```'
            grep -n "^\s*\(debug\|release\|standalone\|afat\|bundleAfat\|standalone[A-Za-z]*\)\s*{" TMessagesProj_App/build.gradle* | f | head -30
            echo '```'
            echo "## D. package in manifests"
            echo '```'
            grep -rn "package=\|android:authorities" --include=AndroidManifest.xml TMessagesProj_App TMessagesProj | cut -c1-200 | f | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
