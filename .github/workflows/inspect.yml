name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print settings list start
        run: |
          F=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          show() { awk -v a="$2" -v b="$3" 'NR>=a && NR<=b {printf "%d: %s\n", NR, $0}' "$1" | cut -c1-200 | fold -s -w 52; }
          N=$(grep -n 'R.drawable.settings_features' $F | head -1 | cut -d: -f1)
          S=$(awk -v n=$N 'NR<=n && /^    (private|public|protected)[^=;]*\(.*\)[ ]*\{/ {l=NR} END{print l}' $F)
          {
            echo "## A. start of items method (line $S)"
            echo '```'
            show $F $S $((S+40))
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
