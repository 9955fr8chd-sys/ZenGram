name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print code
        run: |
          show() { awk -v a="$2" -v b="$3" 'NR>=a && NR<=b {printf "%d: %s\n", NR, $0}' "$1" | fold -s -w 52; }
          S=$(find TMessagesProj/src/main/java -name SimpleTextView.java | head -1)
          A=$(find TMessagesProj/src/main/java -name AnimatedEmojiDrawable.java | head -1)
          P=$(find TMessagesProj/src/main/java -name ProfileActivity.java | head -1)
          {
            echo "## A. SimpleTextView click fields"
            echo '```'
            echo "$S"
            for N in $(grep -n 'rightDrawableOnClickListener' $S | cut -d: -f1 | head -8); do show $S $((N-2)) $((N+5)); echo ----; done
            echo '```'
            echo "## B. SimpleTextView touch"
            echo '```'
            N=$(grep -n 'public boolean onTouchEvent' $S | head -1 | cut -d: -f1)
            show $S $N $((N+55))
            echo '```'
            echo "## C. users of setRightDrawableOnClick"
            echo '```'
            grep -rn 'setRightDrawableOnClick' --include=*.java TMessagesProj/src/main/java | cut -c1-200 | fold -s -w 52 | head -40
            echo '```'
            echo "## D. ProfileActivity 5340-5372"
            echo '```'
            show $P 5340 5372
            echo '```'
            echo "## E. Swap class header"
            echo '```'
            N=$(grep -n 'class SwapAnimatedEmojiDrawable' $A | head -1 | cut -d: -f1)
            show $A $N $((N+14))
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
