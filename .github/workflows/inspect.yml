name: Inspect code
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print code
        run: |
          U=TMessagesProj/src/main/java/org/telegram/ui
          R=TMessagesProj/src/main/res
          g() { grep -n "$1" "$2" 2>/dev/null | cut -c1-170 | fold -s -w 52 | head -${3:-16}; }
          {
            echo "## A. Files that use EmojiPacksAlert"
            echo '```'
            grep -rl 'EmojiPacksAlert' --include=*.java TMessagesProj/src/main/java | head -20
            echo '```'
            echo "## B. DialogsActivity title click"
            echo '```'
            g 'EmojiPacksAlert\|getTitleTextView\|statusDrawable.*click\|showStatusSelect' $U/DialogsActivity.java 18
            echo '```'
            echo "## C. ChatAvatarContainer"
            echo '```'
            g 'EmojiPacksAlert\|emojiStatusDrawable\|setOnClickListener' $U/Components/ChatAvatarContainer.java 18
            echo '```'
            echo "## D. ProfileActivity emoji status"
            echo '```'
            g 'EmojiPacksAlert\|emojiStatus\|showStatus' $U/ProfileActivity.java 22
            echo '```'
            echo "## E. FAQ and features"
            echo '```'
            g 'FaqUrl\|FeaturesUrl\|TelegramFaq\|TelegramFeatures' $U/SettingsActivity.java 10
            grep -n 'TelegramFaq\|TelegramFeatures' $R/values/strings.xml | cut -c1-160
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
