name: Build ZenGram
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Insert API keys
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${{ secrets.API_ID }};/" $F
          sed -i "s/APP_HASH = \"[0-9a-f]*\";/APP_HASH = \"${{ secrets.API_HASH }}\";/" $F
      - name: Rename app
        run: |
          find TMessagesProj/src/main/res -name strings.xml -exec sed -i -E 's|(<string name="AppName(Beta)?"[^>]*>)[^<]*</string>|\1ZenGram</string>|' {} +
      - name: Replace icon v3
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          ICON=$(ls *.png *.PNG *.jpg *.jpeg *.JPG 2>/dev/null | head -1)
          R=TMessagesProj/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            D=$R/mipmap-$n
            [ -d "$D" ] || continue
            c=$((s/2))
            $IM "$ICON" -resize ${s}x${s}! $D/ic_launcher.png
            $IM "$ICON" -resize ${s}x${s}! \( -size ${s}x${s} xc:none -fill white -draw "circle $c,$c $c,0" \) -compose DstIn -composite $D/ic_launcher_round.png
            for t in icon_foreground icon_foreground_round icon_foreground_sa; do
              $IM "$ICON" -resize ${f}x${f}! $D/$t.png
            done
          done
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZenGram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
