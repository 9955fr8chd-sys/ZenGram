      - name: Build
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZenGram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
          N: ${{ github.run_number }}
        run: |
          APK=$(ls -S $(find TMessagesProj_App/build/outputs/apk -name '*.apk') | head -1)
          echo "APK: $APK"
          TAG="v0.1.$N"
          cp "$APK" ZenGram.apk
          cp "$APK" "ZenGram-$TAG.apk"
          if [ -z "$NOTES" ]; then NOTES="Обновление ZenGram $TAG"; fi
          gh release create "$TAG" ZenGram.apk "ZenGram-$TAG.apk" --target "${{ github.sha }}" --title "ZenGram $TAG" --notes "$NOTES" --latest
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest: https://github.com/${{ github.repository }}/releases/latest" >> "$GITHUB_STEP_SUMMARY"
