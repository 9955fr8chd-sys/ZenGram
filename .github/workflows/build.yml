name: Build ZenGram
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create signing key (first run only)
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -f signing/zengram.p12 ]; then echo "Signing key already exists"; exit 0; fi
          if [ -z "$KEY_PASS" ]; then echo "WARNING: secret KEY_PASS is empty, no key created"; exit 0; fi
          mkdir -p signing
          keytool -genkeypair -storetype PKCS12 -keystore signing/zengram.p12 -alias zengram -keyalg RSA -keysize 4096 -validity 36500 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=ZenGram, O=ZenGram, C=RU"
          git config user.name "zengram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signing/zengram.p12
          git commit -m "Add signing key"
          git push
          echo "Signing key created"
      - name: Insert API keys
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${{ secrets.API_ID }};/" $F
          sed -i "s/APP_HASH = \"[0-9a-f]*\";/APP_HASH = \"${{ secrets.API_HASH }}\";/" $F
      - name: Package name and signing
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "APP_PACKAGE definitions:"
          grep -rn "APP_PACKAGE" --include=gradle.properties --include=*.gradle . | cut -c1-160
          for f in $(grep -rl "^APP_PACKAGE" --include=gradle.properties .); do
            sed -i -E 's/^(APP_PACKAGE[[:space:]]*=[[:space:]]*).*/\1com.zengram.app/' $f
            grep -n "^APP_PACKAGE" $f
          done
          sed -i 's/applicationIdSuffix "\.beta"//' TMessagesProj_App/build.gradle
          python3 - <<'PY'
          import re, os, json, copy
          p = 'TMessagesProj_App/google-services.json'
          d = json.load(open(p))
          new = copy.deepcopy(d['client'][0])
          new['client_info']['android_client_info']['package_name'] = 'com.zengram.app'
          d['client'].append(new)
          json.dump(d, open(p, 'w'), indent=2)
          print('google-services clients:', len(d['client']))
          if os.path.exists('signing/zengram.p12') and os.environ.get('KEY_PASS'):
              p = 'TMessagesProj_App/build.gradle'
              s = open(p).read()
              s, a = re.subn(r'storeFile\s+file\([^)]*release\.keystore[^)]*\)', 'storeFile file("../signing/zengram.p12")\n            storeType "pkcs12"', s)
              s, b = re.subn(r'storePassword\s+\S+', 'storePassword System.getenv("KEY_PASS")', s)
              s, c = re.subn(r'keyAlias\s+\S+', 'keyAlias "zengram"', s)
              s, e = re.subn(r'keyPassword\s+\S+', 'keyPassword System.getenv("KEY_PASS")', s)
              if e == 0:
                  s = s.replace('keyAlias "zengram"', 'keyAlias "zengram"\n            keyPassword System.getenv("KEY_PASS")')
              open(p, 'w').write(s)
              print('signing patched: storeFile', a, 'storePassword', b, 'keyAlias', c, 'keyPassword', e)
          else:
              print('WARNING: own key not available, building with the old public key')
          PY
      - name: Rename app everywhere
        run: |
          python3 - <<'PY'
          import re, glob
          URL = re.compile(r'(\S*(?:://|t\.me|telegram\.org|telegra\.ph|@)\S*)')
          ELEM = re.compile(r'(<(?:string|item)\b([^>]*)>)(.*?)(</(?:string|item)>)', re.S)
          SPECIAL = [('Telegram Premium','Premium'),('Telegram Stars','Stars'),('Telegram Business','Business'),('Звёзды Telegram','Звёзды'),('Telegram для бизнеса','Для бизнеса')]
          def fix(txt):
              parts = URL.split(txt)
              for i in range(0, len(parts), 2):
                  t = parts[i]
                  for a, b in SPECIAL:
                      t = t.replace(a, b)
                  parts[i] = t.replace('Telegram', 'ZenGram')
              return ''.join(parts)
          def repl(m):
              return m.group(1) + fix(m.group(3)) + m.group(4)
          GH = 'https://github.com/9955fr8chd-sys/ZenGram'
          n = 0
          u = 0
          for f in glob.glob('TMessagesProj/src/main/res/values*/strings*.xml'):
              s = open(f, encoding='utf-8').read()
              s2 = ELEM.sub(repl, s)
              s3 = re.sub(r'(<string name="(?:TelegramFaqUrl|TelegramFeaturesUrl)"[^>]*>)[^<]*(</string>)', lambda m: m.group(1) + GH + m.group(2), s2)
              if s3 != s2:
                  u += 1
              if s3 != s:
                  open(f, 'w', encoding='utf-8').write(s3)
                  n += 1
          print('files changed:', n, ', faq/features url files:', u)
          PY
          find TMessagesProj/src/main/res -name strings.xml -exec sed -i -E 's#(<string name="(AppName|AppNameBeta|Page1Title)"[^>]*>)[^<]*</string>#\1ZenGram</string>#' {} +
      - name: Replace icon v5
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          ICON=$(ls *.png *.PNG *.jpg *.jpeg *.JPG 2>/dev/null | grep -vi '^creator_badge' | head -1)
          echo "Icon file: $ICON"
          R=TMessagesProj/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            D=$R/mipmap-$n
            [ -d "$D" ] || continue
            c=$((s/2))
            $IM "$ICON" -resize ${s}x${s}! $D/ic_launcher.png
            $IM -size ${s}x${s} xc:black -fill white -draw "circle $c,$c $c,0" /tmp/m.png
            $IM "$ICON" -resize ${s}x${s}! /tmp/m.png -alpha off -compose CopyOpacity -composite $D/ic_launcher_round.png
            for t in icon_foreground icon_foreground_round icon_foreground_sa; do
              $IM "$ICON" -resize ${f}x${f}! $D/$t.png
            done
          done
      - name: Alternative icons in colors
        run: |
          IM=$(command -v magick || command -v convert)
          ICON=$(ls *.png *.PNG *.jpg *.jpeg *.JPG 2>/dev/null | grep -vi '^creator_badge' | head -1)
          R=TMessagesProj/src/main/res
          for k in 2:64 3:25 4:169 5:131 6:153; do
            n=${k%%:*}
            h=${k##*:}
            $IM "$ICON" -modulate 100,100,$h /tmp/v$n.png
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read dn s f <<< "$d"
              D=$R/mipmap-$dn
              [ -d "$D" ] || continue
              c=$((s/2))
              $IM -size ${s}x${s} xc:black -fill white -draw "circle $c,$c $c,0" /tmp/m2.png
              [ -f $D/icon_${n}_launcher.png ] && $IM /tmp/v$n.png -resize ${s}x${s}! $D/icon_${n}_launcher.png
              [ -f $D/icon_${n}_launcher_round.png ] && $IM /tmp/v$n.png -resize ${s}x${s}! /tmp/m2.png -alpha off -compose CopyOpacity -composite $D/icon_${n}_launcher_round.png
              for t in foreground foreground_round foreground_sa background_sa; do
                [ -f $D/icon_${n}_$t.png ] && $IM /tmp/v$n.png -resize ${f}x${f}! $D/icon_${n}_$t.png
              done
            done
          done
          true
      - name: Replace intro logo v8
        run: |
          IM=$(command -v magick || command -v convert)
          ICON=$(ls *.png *.PNG *.jpg *.jpeg *.JPG 2>/dev/null | grep -vi '^creator_badge' | head -1)
          echo "Icon file: $ICON"
          R=TMessagesProj/src/main/res
          find $R -name "intro_tg_plane.*" -delete
          mkdir -p $R/drawable-nodpi
          $IM "$ICON" -channel RGB -separate -evaluate-sequence Max -level 31%,51% /tmp/a.png
          $IM "$ICON" /tmp/a.png -alpha off -compose CopyOpacity -composite -trim +repage /tmp/plane.png
          W=$($IM /tmp/plane.png -format %w info:)
          SIDE=$((W*100/64))
          echo "Plane width: $W, canvas: $SIDE"
          $IM /tmp/plane.png -background none -gravity center -extent ${SIDE}x${SIDE} -resize 512x512 $R/drawable-nodpi/intro_tg_plane.png
          I=TMessagesProj/src/main/java/org/telegram/ui/IntroActivity.java
          sed -i "/logo color/s/ThemeColors.TELEGRAM_COLOR/0xFF060215/" $I
          sed -i '/ssb.setSpan(new ImageSpan(logoDrawable)/d' $I
          sed -i 's/LocaleController.getString(R.string.Page1Title)/"ZenGram"/' $I
          grep -n '"ZenGram"' $I || echo "WARNING: intro title not replaced"
          sed -i 's/LocaleController.getString(R.string.Page1Message)/(LocaleController.getString(R.string.Page1Message) + org.telegram.messenger.ZenGramBadge.note())/' $I
          grep -c 'ZenGramBadge.note' $I || echo "WARNING: intro note not added"
          D=TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          echo "ImageSpan(logoDrawable) lines before: $(grep -c 'ImageSpan(logoDrawable)' $D)"
          sed -i '/ssb.setSpan(new ImageSpan(logoDrawable)/d' $D
          echo "ImageSpan(logoDrawable) lines after: $(grep -c 'ImageSpan(logoDrawable)' $D)"
          find $R -name 'telegram_logo_2.*' -delete
          $IM -background none -fill white -font DejaVu-Sans-Bold -pointsize 56 label:ZenGram -trim +repage -bordercolor none -border 4x4 $R/drawable-nodpi/telegram_logo_2.png
      - name: Add creator badge image
        run: |
          IM=$(command -v magick || command -v convert)
          R=TMessagesProj/src/main/res
          mkdir -p $R/drawable-nodpi
          python3 - <<'PY'
          import math, subprocess, shutil
          c = 64
          cmds = ["-size","128x128","xc:none","-fill","#8025FE","-draw","circle 64,64 64,11"]
          for k in range(12):
              a = 2*math.pi*k/12
              x = c + 53*math.cos(a)
              y = c + 53*math.sin(a)
              cmds += ["-draw", "circle %.1f,%.1f %.1f,%.1f" % (x, y, x, y+10)]
          cmds += ["-fill","white","-draw","polygon 30,56 98,34 62,64","-draw","polygon 32,70 58,62 52,77","-draw","polygon 64,67 98,34 80,95 71,88"]
          im = shutil.which("magick") or shutil.which("convert")
          subprocess.run([im] + cmds + ["/tmp/badge_gen.png"], check=True)
          PY
          BADGE=$(find . -iname 'creator_badge*.png' -not -path './.git/*' -not -path './TMessagesProj/*' | head -1)
          echo "Badge file: $BADGE"
          if [ -n "$BADGE" ]; then SRC="$BADGE"; else echo "drawing badge"; SRC=/tmp/badge_gen.png; fi
          $IM "$SRC" -resize 62x62 -background none -gravity center -extent 96x96 $R/drawable-nodpi/creator_badge.png
      - name: Creator badge and ZenGram words everywhere
        run: |
          python3 - <<'PY'
          import re, glob
          J = 'TMessagesProj/src/main/java/org/telegram/'
          HELPER = r'''package org.telegram.messenger;

          import org.telegram.tgnet.TLRPC;

          public class ZenGramBadge {
              public static final long CREATOR_ID = 8492204695L;
              public static final long MAGIC = 6710000001234L;
              private static final java.util.regex.Pattern URL = java.util.regex.Pattern.compile("\\S*(?:://|t\\.me|telegram\\.org|telegra\\.ph|@)\\S*");

              public static class NoTint extends android.graphics.drawable.BitmapDrawable {
                  public NoTint(android.content.res.Resources r, android.graphics.Bitmap b) {
                      super(r, b);
                      setFilterBitmap(true);
                  }
                  @Override public void setColorFilter(android.graphics.ColorFilter f) {}
                  @Override public void setTint(int t) {}
                  @Override public void setTintList(android.content.res.ColorStateList l) {}
                  @Override public void setTintMode(android.graphics.PorterDuff.Mode m) {}
              }

              public static android.graphics.drawable.Drawable badge() {
                  try {
                      android.content.res.Resources r = ApplicationLoader.applicationContext.getResources();
                      android.graphics.Bitmap b = android.graphics.BitmapFactory.decodeResource(r, R.drawable.creator_badge);
                      return b == null ? null : new NoTint(r, b);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              public static void showPlate(final android.view.View anchor) {
                  try {
                      final android.content.Context ctx = anchor.getContext();
                      final boolean ru = "ru".equals(java.util.Locale.getDefault().getLanguage());
                      final String handle = "@c1csy";
                      final String rest = ru ? " создатель ZenGram" : " creator of ZenGram";
                      android.text.SpannableString sp = new android.text.SpannableString(handle + rest);
                      final android.widget.PopupWindow[] pw = new android.widget.PopupWindow[1];
                      sp.setSpan(new android.text.style.ClickableSpan() {
                          @Override public void onClick(android.view.View v) {
                              try {
                                  if (pw[0] != null) pw[0].dismiss();
                                  org.telegram.messenger.browser.Browser.openUrl(ctx, "https://t.me/c1csy");
                              } catch (Throwable ignore) {}
                          }
                          @Override public void updateDrawState(android.text.TextPaint ds) {
                              ds.setColor(0xFF9DB4FF);
                              ds.setUnderlineText(false);
                              ds.setFakeBoldText(true);
                          }
                      }, 0, handle.length(), android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      android.widget.TextView tv = new android.widget.TextView(ctx);
                      tv.setText(sp);
                      tv.setMovementMethod(android.text.method.LinkMovementMethod.getInstance());
                      tv.setTextColor(0xFFFFFFFF);
                      tv.setTextSize(14);
                      tv.setPadding(AndroidUtilities.dp(14), AndroidUtilities.dp(10), AndroidUtilities.dp(14), AndroidUtilities.dp(10));
                      android.graphics.drawable.GradientDrawable bg = new android.graphics.drawable.GradientDrawable();
                      bg.setColor(0xF0261A52);
                      bg.setCornerRadius(AndroidUtilities.dp(14));
                      tv.setBackground(bg);
                      pw[0] = new android.widget.PopupWindow(tv, android.view.ViewGroup.LayoutParams.WRAP_CONTENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT, true);
                      pw[0].setOutsideTouchable(true);
                      pw[0].setElevation(AndroidUtilities.dp(8));
                      pw[0].showAsDropDown(anchor, 0, AndroidUtilities.dp(4));
                  } catch (Throwable ignore) {}
              }

              public static void apply(TLRPC.User u) {
                  try {
                      if (u != null && u.id == CREATOR_ID) {
                          TLRPC.TL_emojiStatus s = new TLRPC.TL_emojiStatus();
                          s.document_id = MAGIC;
                          u.emoji_status = s;
                          u.premium = true;
                      }
                  } catch (Throwable ignore) {}
              }

              public static String note() {
                  return "ru".equals(java.util.Locale.getDefault().getLanguage()) ? " Неофициальный клиент на платформе Telegram." : " Unofficial client built on the Telegram platform.";
              }

              private static String fix(String t) {
                  t = t.replace("Telegram Premium", "Premium").replace("Telegram Stars", "Stars").replace("Telegram Business", "Business").replace("Звёзды Telegram", "Звёзды").replace("Telegram для бизнеса", "Для бизнеса");
                  return t.replace("Telegram", "ZenGram");
              }

              public static String brand(String s) {
                  if (s == null || s.indexOf("Telegram") < 0) return s;
                  StringBuilder out = new StringBuilder();
                  java.util.regex.Matcher m = URL.matcher(s);
                  int last = 0;
                  while (m.find()) {
                      out.append(fix(s.substring(last, m.start())));
                      out.append(m.group());
                      last = m.end();
                  }
                  out.append(fix(s.substring(last)));
                  return out.toString();
              }

              public static void brandMap(java.util.Map m) {
                  if (m == null) return;
                  try {
                      for (Object o : m.entrySet()) {
                          java.util.Map.Entry e = (java.util.Map.Entry) o;
                          Object k = e.getKey();
                          Object v = e.getValue();
                          if (k instanceof String && (k.equals("TelegramFaqUrl") || k.equals("TelegramFeaturesUrl"))) {
                              e.setValue("https://github.com/9955fr8chd-sys/ZenGram");
                          } else if (v instanceof String && ((String) v).indexOf("Telegram") >= 0) {
                              e.setValue(brand((String) v));
                          }
                      }
                  } catch (Throwable ignore) {}
              }
          }
          '''
          open(J + 'messenger/ZenGramBadge.java', 'w', encoding='utf-8').write(HELPER)

          p = J + 'ui/Components/AnimatedEmojiDrawable.java'
          s = open(p, encoding='utf-8').read()
          i = s.index('class SwapAnimatedEmojiDrawable')
          head, tail = s[:i], s[i:]
          tail, nf = re.subn(r'(private final Drawable\[\] drawables = new Drawable\[2\];)', lambda m: m.group(1) + '\n public boolean zenBadge;\n public boolean isZenBadge() { return zenBadge || drawables[0] instanceof org.telegram.messenger.ZenGramBadge.NoTint; }\n', tail, count=1)
          print('Swap flag patched:', nf)
          pat = re.compile(r'(public\s+boolean\s+set\(\s*long\s+(\w+)\s*,\s*int\s+(\w+)\s*,\s*boolean\s+(\w+)\s*\)\s*\{)')
          def sw(m):
              d, a = m.group(2), m.group(4)
              code = 'try { android.graphics.drawable.Drawable zb = org.telegram.messenger.ZenGramBadge.badge(); if (zb != null) { set(zb, %s); zenBadge = true; return true; } } catch (Throwable ignore) {}' % a
              return m.group(1) + '\n if (%s == org.telegram.messenger.ZenGramBadge.MAGIC) { %s }\n zenBadge = false;\n' % (d, code)
          tail, n1 = pat.subn(sw, tail, count=1)
          open(p, 'w', encoding='utf-8').write(head + tail)
          print('Swap.set patched:', n1)

          p = J + 'ui/ActionBar/SimpleTextView.java'
          s = open(p, encoding='utf-8').read()
          ZEN = '''private boolean zenDown;
              private boolean zenHandle(MotionEvent event) {
                  try {
                      if (!(rightDrawable instanceof org.telegram.ui.Components.AnimatedEmojiDrawable.SwapAnimatedEmojiDrawable) || !((org.telegram.ui.Components.AnimatedEmojiDrawable.SwapAnimatedEmojiDrawable) rightDrawable).isZenBadge()) {
                          zenDown = false;
                          return false;
                      }
                      int a = event.getAction();
                      AndroidUtilities.rectTmp.set(rightDrawableX - dp(20), rightDrawableY - dp(20), rightDrawableX + dp(20), rightDrawableY + dp(20));
                      if (a == MotionEvent.ACTION_DOWN && AndroidUtilities.rectTmp.contains((int) event.getX(), (int) event.getY())) {
                          zenDown = true;
                          getParent().requestDisallowInterceptTouchEvent(true);
                          return true;
                      }
                      if (zenDown && a == MotionEvent.ACTION_UP) {
                          zenDown = false;
                          getParent().requestDisallowInterceptTouchEvent(false);
                          org.telegram.messenger.ZenGramBadge.showPlate(this);
                          return true;
                      }
                      if (zenDown && a == MotionEvent.ACTION_CANCEL) {
                          zenDown = false;
                          getParent().requestDisallowInterceptTouchEvent(false);
                          return true;
                      }
                      if (zenDown) return true;
                  } catch (Throwable ignore) {}
                  return false;
              }
          '''
          s, n8 = re.subn(r'(public boolean onTouchEvent\(MotionEvent event\) \{)', lambda m: m.group(1) + '\n if (zenHandle(event)) return true;\n', s, count=1)
          s, n9 = re.subn(r'(public static interface PressableDrawable \{)', lambda m: ZEN + '\n' + m.group(1), s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print('SimpleTextView patched:', n8, n9)

          if n1 > 0:
              p = J + 'messenger/MessagesController.java'
              s = open(p, encoding='utf-8').read()
              pat = re.compile(r'(public\s+(?:synchronized\s+)?(?:boolean|void)\s+putUser\(\s*(?:final\s+)?TLRPC\.User\s+(\w+)\s*,[^)]*\)\s*\{)')
              s, n2 = pat.subn(lambda m: m.group(1) + '\n ZenGramBadge.apply(' + m.group(2) + ');\n', s)
              open(p, 'w', encoding='utf-8').write(s)
              print('putUser patched:', n2)
              p = J + 'messenger/UserConfig.java'
              s = open(p, encoding='utf-8').read()
              pat = re.compile(r'(public\s+(?:synchronized\s+)?void\s+setCurrentUser\(\s*(?:final\s+)?TLRPC\.User\s+(\w+)\s*\)\s*\{)')
              s, n3 = pat.subn(lambda m: m.group(1) + '\n ZenGramBadge.apply(' + m.group(2) + ');\n', s)
              open(p, 'w', encoding='utf-8').write(s)
              print('setCurrentUser patched:', n3)
          else:
              print('WARNING: badge swap NOT applied, real status stays')

          p = J + 'messenger/LocaleController.java'
          s = open(p, encoding='utf-8').read()
          s, c1 = re.subn(r'ApplicationLoader\.applicationContext\.getString\(([^()]*)\)', r'ZenGramBadge.brand(ApplicationLoader.applicationContext.getString(\1))', s)
          s, c2 = re.subn(r'(getInstance\(\)\.getStringV2\([^()]*\))', r'ZenGramBadge.brand(\1)', s)
          s, c3 = re.subn(r'(return\s+)(getString\(\s*null\s*,\s*res\s*\))', r'\1ZenGramBadge.brand(\2)', s)
          s, c4 = re.subn(r'(localeValues\s*=\s*getLocaleFileStrings\([^;]*\);)', r'\1 ZenGramBadge.brandMap(localeValues);', s)
          s, c5 = re.subn(r'(localeValues\.putAll\(getLocaleFileStrings\([^;]*\)\);)', r'\1 ZenGramBadge.brandMap(localeValues);', s)
          m = re.search(r'private\s+String\s+getStringInte\w*\([^)]*\)\s*\{', s)
          n6 = 0
          if m:
              j = s.index('return value;', m.end())
              s = s[:j] + 'return ZenGramBadge.brand(value);' + s[j + len('return value;'):]
              n6 = 1
          open(p, 'w', encoding='utf-8').write(s)
          print('LocaleController: appContext.getString:', c1, ', getInstance().getStringV2:', c2, ', return getString(null,res):', c3, ', localeValues assign:', c4, ', putAll:', c5, ', getStringInternal:', n6)
          PY
      - name: Report hard-coded Telegram words
        run: |
          {
            echo "## Java string literals with Telegram"
            echo '```'
            grep -rnE '"[^"]*Telegram[^"]*"' --include=*.java TMessagesProj/src/main/java | grep -v 'org\.telegram' | cut -c1-200 | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZenGram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
